<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Mimi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h2>Ajude a Mimi</h2>
        <section id="game">
            <div id="progress-wrapper" class="hidden">
                <p id="phase-indicator">Fase 1 / 6</p>
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
            <div id="question-container"></div>
            <button id="next-btn" class="hidden">Próxima Fase</button>
        </section>

        <section id="cpu-container">
            <h2 class="h2">whiskas</h2>
            <div id="pieces"></div>
        </section>

        <section id="end-screen" class="hidden">
            <h2>Parabéns!</h2>
            <p> Você ajudou a Mimi a reunir todos os Whiskas Místicos! </p>
        </section>
        
        <button id="restart-game-btn">Reiniciar Jogo</button>
    </main>

    <img src="imagens/miau.png" alt="Miau animado" id="miauMascote" class="hidden">
    <div id="miauMensagem" class="hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
